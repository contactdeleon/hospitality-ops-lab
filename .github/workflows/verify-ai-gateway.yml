name: Verify AI Superfriends Gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Signed gateway handoff test
        env:
          GATEWAY_HMAC_KEY: ${{ secrets.GATEWAY_HMAC_KEY }}
          GATEWAY_URL: https://ai-superfriends-gateway.contactdeleon.workers.dev/v1/handoff
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          now = datetime.datetime.now(datetime.timezone.utc)
          task_id = "CTOO-GATEWAY-VERIFY-" + os.environ["RUN_ID"] + "-" + os.environ["RUN_ATTEMPT"]
          payload = {
              "agent_role": "chatgpt",
              "task_id": task_id,
              "status": "complete",
              "summary": "Automated signed Cloudflare gateway to GitHub handoff verification.",
              "evidence": ["GitHub Actions run " + os.environ["RUN_ID"]],
              "blockers": "None",
              "next_action": "Confirm GitHub Issue #1 notification arrives in Slack.",
              "director_approval_required": False,
              "created_at": now.isoformat().replace("+00:00", "Z"),
          }
          body = json.dumps(payload, separators=(",", ":"), ensure_ascii=False).encode()
          timestamp = str(int(time.time()))
          signature = hmac.new(
              os.environ["GATEWAY_HMAC_KEY"].encode(),
              timestamp.encode() + b"." + body,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["GATEWAY_URL"],
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "DeLeonGroup-GatewayVerifier/1.0",
                  "x-ai-timestamp": timestamp,
                  "x-ai-signature": "sha256=" + signature,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
                  if (
                      response.status != 201
                      or result.get("status") != "accepted"
                      or not result.get("ledger_url", "").startswith(
                          "https://github.com/contactdeleon/hospitality-ops-lab/issues/1#issuecomment-"
                      )
                  ):
                      raise SystemExit("Gateway returned an unexpected acceptance response.")
                  comment_url = result["ledger_url"]
                  print("Gateway handoff accepted.")
                  print("GitHub comment: " + comment_url)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(
                          "### Gateway signed handoff verified\n\n"
                          + "GitHub comment: " + comment_url + "\n\n"
                          + "Check #deleon-group-ai-hq for the matching notification.\n"
                      )
          except urllib.error.HTTPError as error:
              print("Gateway returned HTTP " + str(error.code))
              raise SystemExit(1)
          except urllib.error.URLError as error:
              print("Gateway request failed: " + type(error.reason).__name__)
              raise SystemExit(1)
          PY
