name: Verify AI Superfriends Gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Signed gateway handoff test
        env:
          GATEWAY_HMAC_KEY: ${{ secrets.GATEWAY_HMAC_KEY }}
          GATEWAY_URL: https://ai-superfriends-gateway.contactdeleon.workers.dev/v1/handoff
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$GATEWAY_HMAC_KEY" ]; then
            echo "::error::Add GATEWAY_HMAC_KEY as a GitHub Actions repository secret. Use the exact same value configured in Cloudflare; never paste it into issues or logs."
            exit 1
          fi
          python3 - <<'PY'
          import datetime,hashlib,hmac,json,os,time,urllib.error,urllib.request
          now=datetime.datetime.now(datetime.timezone.utc)
          task_id="CTOO-GATEWAY-VERIFY-"+os.environ["RUN_ID"]+"-"+os.environ["RUN_ATTEMPT"]
          payload={
            "agent_role":"chatgpt","task_id":task_id,"status":"complete",
            "summary":"Automated signed Cloudflare gateway to GitHub handoff verification.",
            "evidence":["GitHub Actions run "+os.environ["RUN_ID"]],
            "blockers":"None","next_action":"Confirm GitHub Issue #1 notification arrives in Slack.",
            "director_approval_required":False,"created_at":now.isoformat().replace("+00:00","Z")
          }
          body=json.dumps(payload,separators=(",",":"),ensure_ascii=False).encode()
          timestamp=str(int(time.time()))
          signature=hmac.new(os.environ["GATEWAY_HMAC_KEY"].encode(),timestamp.encode()+b"."+body,hashlib.sha256).hexdigest()
          with open("/tmp/gateway-payload.json","wb") as file:
            file.write(body)
          with open("/tmp/gateway-auth.env","w") as file:
            file.write("AI_TIMESTAMP="+timestamp+"\n")
            file.write("AI_SIGNATURE=sha256="+signature+"\n")
          PY
          source /tmp/gateway-auth.env
          http_code=$(curl --silent --show-error --max-time 25 --retry 1 \\
            -D /tmp/gateway-headers.txt -o /tmp/gateway-response.json -w '%{http_code}' \\
            -A 'Mozilla/5.0 (compatible; DeLeonGatewayVerification/1.0)' \\
            -H 'Content-Type: application/json' -H 'Accept: application/json' \\
            -H "x-ai-timestamp: $AI_TIMESTAMP" -H "x-ai-signature: $AI_SIGNATURE" \\
            --data-binary @/tmp/gateway-payload.json "$GATEWAY_URL")
          echo "Gateway HTTP status: $http_code"
          if [ "$http_code" != 201 ]; then
            echo "::error::Gateway test failed with HTTP $http_code"
            grep -iE '^(cf-ray|server|content-type):' /tmp/gateway-headers.txt || true
            if grep -q '"error"' /tmp/gateway-response.json; then
              python3 - <<'PYERR'
          import json
          try:
            with open("/tmp/gateway-response.json") as f: data=json.load(f)
            print("Gateway error:",data.get("error","unknown"))
          except Exception: print("Non-JSON response from edge (likely blocked before Worker)")
          PYERR
            else
              echo "Non-JSON response from edge (likely blocked before Worker)"
            fi
            exit 1
          fi
          python3 - <<'PYRESULT'
          import json,os
          with open("/tmp/gateway-response.json") as f: result=json.load(f)
          url=result.get("ledger_url","")
          if result.get("status")!="accepted" or not url.startswith("https://github.com/contactdeleon/hospitality-ops-lab/issues/1#issuecomment-"):
            raise SystemExit("Unexpected gateway response")
          print("Gateway handoff accepted:",url)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("### Signed gateway handoff verified\\n\\nGitHub comment: "+url+"\\n\\nVerify matching Slack notification separately.\\n")
          PYRESULT
