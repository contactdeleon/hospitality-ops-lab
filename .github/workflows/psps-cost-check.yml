name: PSPS Cost Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch product variant prices
        env:
          TOKEN: ${{ secrets.PSPS_PRINTIFY_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          token=os.environ["TOKEN"]
          for bp,provider in [(12,99),(1447,99)]:
              url=f"https://api.printify.com/v1/catalog/blueprints/{bp}/print_providers/{provider}/variants.json"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"PSPS-CostCheck/1.0"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              for v in data.get("variants",[]):
                  if str(v.get("title","")).lower().startswith("black /"):
                      print("Blueprint",bp,"variant",v.get("id"),"title",v.get("title"),"catalog_price_cents",v.get("price"),"cost",v.get("cost"))
          PY
